moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
moveit_simple_controller_manager:
  controller_names: [rm_group_controller]
  rm_group_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6, joint_7]
trajectory_execution:
  # Gazebo publishes simulated trajectory time while MoveIt supervises with
  # wall time. Keep the safety and controller tolerances unchanged, but allow
  # a measured real-time factor down to roughly 0.6 without canceling a sound
  # trajectory before the simulated controller reaches its terminal sample.
  allowed_execution_duration_scaling: 1.8
  allowed_goal_duration_margin: 2.0
  allowed_start_tolerance: 0.01
