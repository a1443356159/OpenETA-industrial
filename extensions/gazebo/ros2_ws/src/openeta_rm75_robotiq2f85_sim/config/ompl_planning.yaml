planning_plugins:
  - ompl_interface/OMPLPlanner
request_adapters:
  - default_planning_request_adapters/ResolveConstraintFrames
  - default_planning_request_adapters/ValidateWorkspaceBounds
  - default_planning_request_adapters/CheckStartStateBounds
  - default_planning_request_adapters/CheckStartStateCollision
response_adapters:
  - default_planning_response_adapters/AddTimeOptimalParameterization
  - default_planning_response_adapters/ValidateSolution
  - default_planning_response_adapters/DisplayMotionPath
planner_configs:
  RRTConnectkConfigDefault: {type: geometric::RRTConnect, range: 0.0}
rm_group:
  planner_configs: [RRTConnectkConfigDefault]
  # The default 1% state-space interpolation can step over thin industrial
  # parts (bolt shafts, wrench handles) during OMPL search.  ValidateSolution
  # then rejects the otherwise complete path too late for RRTConnect to find
  # another route.  Keep target/gripper collisions forbidden and sample the
  # path densely enough for the planner itself to route around those parts.
  longest_valid_segment_fraction: 0.002
