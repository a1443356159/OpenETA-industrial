controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster: {type: joint_state_broadcaster/JointStateBroadcaster}
    rm75_arm_controller: {type: joint_trajectory_controller/JointTrajectoryController}
    parallel_gripper_controller: {type: parallel_gripper_controller/ParallelGripperActionController}
rm75_arm_controller:
  ros__parameters:
    joints: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6, joint_7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
parallel_gripper_controller:
  ros__parameters:
    joint: gripper_left_finger_joint
    max_effort: 100.0
