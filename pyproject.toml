[project]
name = "openeta"
version = "0.1.0"
description = "OpenETA embodied agent runtime and simulator integration."
requires-python = ">=3.12,<3.13"
dependencies = [
  "gymnasium>=1.0",
  "imageio[ffmpeg]>=2.34",
  # The OpenETA MCP proxy uses the FastMCP 1.x import/API surface.
  "mcp>=1.0,<2",
  "numpy>=1.26",
  "Pillow>=10",
  "PyYAML>=6.0",
  "prompt_toolkit>=3.0",
  # The simulator MCP HTTP server imports these packages directly.  Keep them
  # first-class dependencies so a clean acceptance venv does not accidentally
  # rely on a host ROS/Python environment's transitive packages.
  "starlette>=0.27",
  "tiktoken>=0.7",
  "uvicorn>=0.23",
]

[project.scripts]
openeta = "agent.cli.openeta_cli:main"
openeta-robocasa-benchmark = "scripts.robocasa_benchmark:main"
openeta-batch = "agent.cli.batch_eval:main"
openeta-subagent-eval = "agent.cli.subagent_eval:main"
openeta-replay = "logger.replay:main"

[project.optional-dependencies]
dev = [
  # ROS 2 Jazzy's launch_testing pytest entry point imports this when a live
  # test sources the vendor ROS environment.
  "lark>=1.1",
  # ROS 2 Jazzy's launch_testing pytest plugin still uses pytest 8's
  # collection hook signature; pytest 9 rejects it at plugin registration.
  "pytest>=8,<9",
]
# Compatibility name only. Real-robot SDKs are intentionally isolated from
# the Python 3.12 M0-M2 lock because the L515-compatible pyrealsense2 wheel is
# available only through CPython 3.11. See real/requirements-hardware.txt.
real = []

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adapter*", "agent*", "extensions*", "logger*", "real*", "scripts*", "sim*", "tools*"]

[tool.setuptools.package-data]
"agent.skills" = ["*.md"]
"agent.prompts" = ["*.md"]
"real" = ["*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  "agent/codex",
  "third_party",
]
