inherit_from: base.yaml

experiment:
  experiment_name: openeta_anyplace_multitask
  num_iterations: 50
  meshcat_on: false
  pybullet_viz: false
  is_parent_shapenet_obj: false
  is_child_shapenet_obj: true
  n_parent_instances: 1
  parent_crop: false
  show_floating_hand_meshcat: false
  use_floating_hand_execution: false
  eval:
    pose_refine_model_name: openeta_anyplace_multitask
    ckpt_path: /root/autodl-tmp/openeta-services/anyplace/checkpoints/anyplace_ckpts/anyplace_multitask/model.pth
    use_molmo: false
    remove_redundant_pose: false
    model_type: anyplace_diffusion_molmocrop
    model_name: anyplace_diffusion_molmocrop_multitask_newrun
    rand_mesh_scale: false
    parent_load_pose_type: random_upright
    child_load_pose_type: random_upright
    inference_method: multistep_regression_scene
    return_rand: false
    with_coll: false
    # One learned refinement step preserves the network's gravity-aligned
    # initialization for already-supported industrial parts.  Longer
    # diffusion chains were measured to accumulate large rotations when the
    # success classifier is unavailable, turning otherwise stable model
    # proposals onto narrow edges.  Endpoint legality, attached-state
    # validation, and L5 planning remain mandatory.
    n_refine_iters: 1
    # Industrial parts are already resting in one observed stable orientation.
    # Initialising refinement from that measured orientation preserves a
    # grasp-compatible branch for elongated parts while the learned policy
    # still refines all 96 translations and rotations against the destination.
    # This is an upstream AnyPlace inference mode, not a host-generated pose.
    init_orig_ori: true
    # Overridden by the OpenETA AnyPlace service's startup-only candidate count.
    init_k_val: 10
    no_success_classifier: true
    variable_size_crop: true
    timestep_emb_decay_factor: 20
    # Qualification requires a repeatable frozen frontier.  The upstream
    # diffusion noise is useful for exploratory generation, but not when all
    # 96 learned initializations are already retained for deterministic
    # recovery.
    add_per_iter_noise: false
    per_iter_noise_kwargs:
      rot:
        angle_deg: 20
        rate: 6.5
      trans:
        trans_dist: 0.03
        rate: 5.5

model:
  refine_pose:
    type: nsm_transformer
    feat_dim: 3
    model_kwargs:
      nsm_transformer:
        n_queries: 1
        use_timestep_emb: true
        max_timestep: 5
        timestep_pool_method: meanpool
