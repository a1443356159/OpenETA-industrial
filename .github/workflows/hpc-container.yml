name: Build OpenETA HPC/Slurm container

on:
  push:
    tags:
      - openeta-container-*
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: openeta-slurm-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disposable runner image space
        run: |
          sudo docker system prune --all --force
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/ubuntu/Dockerfile
          build-args: OPENETA_REVISION=${{ github.sha }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openeta-slurm:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Reuse established layers, but do not re-export the multi-GB
          # ROS/CUDA cache after every immutable candidate publication.
          cache-from: type=gha
          provenance: mode=max
          # The full ROS/CUDA SPDX attestation exceeds GitHub's 40 MiB
          # artifact limit. Reproducibility remains enforced by the OCI
          # digest, maximal provenance, immutable source and pinned inputs.
          sbom: false

      - name: Record image identity
        run: |
          printf '%s\n' \
            'image=ghcr.io/${{ github.repository_owner }}/openeta-slurm:sha-${{ github.sha }}' \
            'digest=${{ steps.build.outputs.digest }}' \
            'revision=${{ github.sha }}' \
            | tee openeta-slurm-image.txt

      - uses: actions/upload-artifact@v4
        with:
          name: openeta-slurm-image-${{ github.sha }}
          path: openeta-slurm-image.txt
          retention-days: 30
